name: Hermes Joint Release Build and Publish
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed Hermes server commit
        required: true
      android_sha:
        description: Full reviewed independent Android release commit
        required: true
      task_id:
        description: Unique task ID for this delivery batch
        required: true
      version:
        description: Ledger-allocated unified versionName (from revision ledger)
        required: true
      android_code:
        description: Ledger-allocated Android versionCode (from revision ledger)
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: hermes-joint-release
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ inputs.version }}
      android_code: ${{ inputs.android_code }}
      revision: ${{ steps.validate.outputs.revision }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: stevenzxs/hermes-agent
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: stevenzxs/hermes-android
          ref: ${{ inputs.android_sha }}
          path: android
          fetch-depth: 0
          persist-credentials: false
      - name: Validate ledger-allocated inputs
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_CODE: ${{ inputs.android_code }}
          TASK_ID: ${{ inputs.task_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_SHA: ${{ inputs.android_sha }}
          CONFIG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'linux')
          from revision_versions import versions_for_revision
          version = os.environ['VERSION']
          code = int(os.environ['ANDROID_CODE'])
          for rev in range(1, 1000):
              v = versions_for_revision(rev)
              if v['agent_version'] == version and v['android_code'] == code:
                  break
          else:
              raise ValueError(f'Version {version}+{code} is not a valid ledger allocation')
          print(f'revision={rev}', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          print(f'image_tag={v["image_tag"]}', file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          r = dict(source_sha=os.environ['SOURCE_SHA'],
                   android_sha=os.environ['ANDROID_SHA'],
                   config_sha=os.environ['CONFIG_SHA'],
                   version=version, android_code=code)
          pathlib.Path('request.json').write_text(json.dumps(r))
          PY
          echo "Validated ledger allocation: version=$VERSION android_code=$ANDROID_CODE task=$TASK_ID"
      - name: Validate fixed inputs and committed version contract
        env:
          CONFIG_SHA: ${{ github.sha }}
        run: |
          python3 -B -m unittest discover -s linux -p 'test_*.py'
          python3 linux/release_contract.py request.json android
          test "$(git -C source rev-parse HEAD)" = "${{ inputs.source_sha }}"
          test "$(git -C android rev-parse HEAD)" = "${{ inputs.android_sha }}"
          git -C android merge-base --is-ancestor 6a880cdb5531255501c6c237eb6909c5bc13c57c HEAD
  image:
    needs: admit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: stevenzxs/hermes-agent
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Write install stamp and build image
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIG_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          IMAGE_TAG: ${{ needs.admit.outputs.image_tag }}
        run: |
          set -euo pipefail
          install -d delivery
          commit_date=$(git -C source show -s --format=%ct "$SOURCE_SHA")
          python3 source/scripts/write_install_stamp.py \
            --output source/install-stamp.json --commit "$SOURCE_SHA" \
            --base-version 0.23.1 --display-version "${{ inputs.version }}" --distance 0 \
            --commit-date "$commit_date" \
            --distribution docker --update-mechanism external --source ci
          unique="ghcr.io/stevenzxs/hermes-agent:src-${SOURCE_SHA:0:12}-cfg-${CONFIG_SHA:0:12}"
          docker build --platform linux/amd64 --progress plain \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label 'org.opencontainers.image.source=https://github.com/stevenzxs/hermes-agent' \
            --label "io.stevenzxs.hermes.config-revision=$CONFIG_SHA" \
            -t "$unique" -t "ghcr.io/stevenzxs/hermes-agent:$IMAGE_TAG" source/
          docker run --rm --network none --entrypoint /opt/hermes/.venv/bin/python "$unique" -c \
            'import json,sys; s=json.load(open("/opt/hermes/install-stamp.json")); p=json.load(open("/etc/hermes/image-provenance.json")); assert s["commit"] == sys.argv[1] == p["revision"]; assert s["baseVersion"] == "0.23.1"; assert s["distribution"] == "docker"; assert s["updateMechanism"] == "external"; print("Internal source identity verified")' \
            "$SOURCE_SHA" | tee delivery/identity-check.log
          docker run --rm --network none "$unique" --version
      - name: Gateway smoke test on loopback
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          UNIQUE="ghcr.io/stevenzxs/hermes-agent:src-${SOURCE_SHA:0:12}-cfg-${CONFIG_SHA:0:12}"
          key=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          docker run -d --name hermes-smoke -p 127.0.0.1:18642:8642 \
            -e API_SERVER_KEY="$key" -e API_SERVER_ENABLED=true -e API_SERVER_HOST=0.0.0.0 \
            "$UNIQUE" gateway run
          ok=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:18642/health || true)
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { docker logs hermes-smoke; exit 1; }
          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18642/health)
          noauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18642/v1/models)
          wrong=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong-token" http://127.0.0.1:18642/v1/models)
          good=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" http://127.0.0.1:18642/v1/models)
          python3 - "$health" "$noauth" "$wrong" "$good" <<'PY'
          import json, sys
          smoke = dict(health=int(sys.argv[1]), unauthenticated=int(sys.argv[2]),
                       wrong_token=int(sys.argv[3]), authenticated=int(sys.argv[4]))
          assert smoke == dict(health=200, unauthenticated=401, wrong_token=401, authenticated=200), smoke
          print(json.dumps(smoke))
          PY
          python3 - "$health" "$noauth" "$wrong" "$good" > delivery/gateway-smoke.json <<'PY'
          import json, sys
          print(json.dumps(dict(health=int(sys.argv[1]), unauthenticated=int(sys.argv[2]),
                                wrong_token=int(sys.argv[3]), authenticated=int(sys.argv[4]))))
          PY
          docker rm -f hermes-smoke >/dev/null
      - name: Resolve or verify existing version tag
        id: tagcheck
        env:
          VERSION: ${{ needs.admit.outputs.image_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tok=$(curl -s "https://ghcr.io/token?scope=repository:stevenzxs/hermes-agent:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /tmp/existing-manifest.json -w '%{http_code}' -H "Authorization: Bearer $tok" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/stevenzxs/hermes-agent/manifests/$VERSION")
          if [ "$code" = "404" ]; then
            echo "Tag $VERSION is free; will publish after verification"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$code" = "200" || { echo "Unexpected registry response HTTP $code for $VERSION"; exit 1; }
          digest=$(curl -sI -H "Authorization: Bearer $tok" -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/stevenzxs/hermes-agent/manifests/$VERSION" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2; exit}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Tag $VERSION already exists at $digest; verifying pinned identity labels"
          config_digest=$(python3 -c 'import json; print(json.load(open("/tmp/existing-manifest.json"))["config"]["digest"])')
          curl -sL -H "Authorization: Bearer $tok" "https://ghcr.io/v2/stevenzxs/hermes-agent/blobs/$config_digest" > /tmp/existing-config.json
          python3 - "$SOURCE_SHA" <<'PY'
          import json, sys
          source_sha = sys.argv[1]
          labels = json.load(open('/tmp/existing-config.json')).get('config', {}).get('Labels', {})
          assert labels.get('org.opencontainers.image.revision') == source_sha, labels
          pathlib_out = labels.get('io.stevenzxs.hermes.config-revision')
          assert pathlib_out and len(pathlib_out) == 40, labels
          print('Existing tag pinned identity verified for reuse; built by config', pathlib_out)
          PY
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Publish image and record digest
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.admit.outputs.image_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIG_SHA: ${{ github.sha }}
          REUSED: ${{ steps.tagcheck.outputs.exists }}
          REUSED_DIGEST: ${{ steps.tagcheck.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$REUSED" = "true" ]; then
            digest="$REUSED_DIGEST"
            echo "Reusing already published $VERSION at $digest"
          else
            UNIQUE="ghcr.io/stevenzxs/hermes-agent:src-${SOURCE_SHA:0:12}-cfg-${CONFIG_SHA:0:12}"
            docker login ghcr.io -u ${{ github.actor }} --password-stdin <<<"$GITHUB_TOKEN"
            docker push "$UNIQUE"
            docker push "ghcr.io/stevenzxs/hermes-agent:$VERSION"
            digest=$(docker buildx imagetools inspect "ghcr.io/stevenzxs/hermes-agent:$VERSION" | awk '$1 == "Digest:" {print $2; exit}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          install -d delivery
          printf 'ghcr.io/stevenzxs/hermes-agent@%s\n' "$digest" > delivery/published-image.txt
          printf '{"sourceCommit":"%s","configCommit":"%s","version":"%s","platform":"linux/amd64","image":"ghcr.io/stevenzxs/hermes-agent@%s","runUrl":"%s"}\n' \
            "$SOURCE_SHA" "$CONFIG_SHA" "$VERSION" "$digest" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > delivery/build-record.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-joint-image-${{ github.run_id }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
  android:
    needs: admit
    uses: ./.github/workflows/hermes-android.yml
    with:
      android_sha: ${{ inputs.android_sha }}
      version: ${{ inputs.version }}
      android_code: ${{ inputs.android_code }}
    secrets: inherit
  package:
    needs: [admit, image, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hermes-*
          path: bundle
          merge-multiple: true
      - name: Assemble joint release manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIG_SHA: ${{ github.sha }}
          ANDROID_SHA: ${{ inputs.android_sha }}
          VERSION: ${{ inputs.version }}
          ANDROID_CODE: ${{ inputs.android_code }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          install -d delivery
          cp bundle/*.apk delivery/
          cp android-baseline.json delivery/
          cd delivery
          sha256sum *.apk > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          d = pathlib.Path('.')
          apks = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(d.glob('*.apk'))}
          assert apks, 'no APK artifacts downloaded'
          manifest = dict(
              version=os.environ['VERSION'], androidCode=int(os.environ['ANDROID_CODE']),
              sourceCommit=os.environ['SOURCE_SHA'], configCommit=os.environ['CONFIG_SHA'],
              androidCommit=os.environ['ANDROID_SHA'],
              image=os.environ['DIGEST'], apks=apks,
              packageName=json.loads(pathlib.Path('android-baseline.json').read_text())['package_name'],
              certificateSha256=json.loads(pathlib.Path('android-baseline.json').read_text())['certificate_sha256'],
              runUrl=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          pathlib.Path('release-manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-joint-release-${{ github.run_id }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
