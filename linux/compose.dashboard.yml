# Optional existing-image dashboard; keep runtime credentials outside Git.
services:
  gateway:
    env_file:
      - ./runtime.env
      - ./dashboard.env
    environment:
      HERMES_DASHBOARD: "true"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.whclaw.top"
